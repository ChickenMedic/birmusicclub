version: 1
backend:
  phases:
    preBuild:
      commands:
        - nvm use 22 || nvm install 22
    build:
      commands:
        # npm ci rejects this lockfile: @aws-amplify/data-construct bundles a plugin-types copy
        # whose dependency (@aws-cdk/toolkit-lib) is not in the bundle. npm install copes with it.
        - npm install --cache .npm --prefer-offline --no-audit --no-fund
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 22 || nvm install 22
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
